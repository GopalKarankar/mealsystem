{% extends "base.html" %}

{% block title %}Sign Up - Meal Tracker{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col bg-white">
  <!-- Navbar -->
  <nav class="sticky top-0 z-10 bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-center sm:justify-start">
      <span class="text-2xl" role="img" aria-label="Fork and plate">🍽️</span>
      <span class="ml-2 text-xl font-bold tracking-tight text-gray-900">Meal Tracker</span>
    </div>
  </nav>

  <!-- Registration Form -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <h1 class="text-2xl font-bold mb-6 text-gray-900">Create Account</h1>

      <!-- Error message -->
      <div id="error-message" class="mb-4 p-4 bg-red-50 border border-red-300 rounded-md text-red-700 text-sm hidden" role="alert" aria-live="polite">
        <p id="error-text"></p>
      </div>

      <!-- Registration Form -->
      <form id="register-form" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-900 mb-2">Username</label>
          <input
            id="username"
            type="text"
            required
            minlength="3"
            maxlength="50"
            pattern="[a-zA-Z0-9_]+"
            placeholder="john_doe"
            class="w-full px-4 py-3 min-h-11 border border-gray-300 rounded-md bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 transition-all"
          />
          <p class="text-xs text-gray-500 mt-1">3-50 characters, letters/numbers/underscore only</p>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-900 mb-2">Email</label>
          <input
            id="email"
            type="email"
            required
            placeholder="you@example.com"
            class="w-full px-4 py-3 min-h-11 border border-gray-300 rounded-md bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 transition-all"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-900 mb-2">Password</label>
          <input
            id="password"
            type="password"
            required
            minlength="8"
            placeholder="••••••••"
            class="w-full px-4 py-3 min-h-11 border border-gray-300 rounded-md bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 transition-all"
          />
          <p class="text-xs text-gray-500 mt-1">At least 8 characters</p>
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-900 mb-2">Confirm Password</label>
          <input
            id="confirmPassword"
            type="password"
            required
            placeholder="••••••••"
            class="w-full px-4 py-3 min-h-11 border border-gray-300 rounded-md bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 transition-all"
          />
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full px-4 py-3 min-h-11 bg-gray-900 text-white font-medium rounded-md hover:bg-opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
        >
          Create Account
        </button>
      </form>

      <!-- Login link -->
      <p class="mt-6 text-center text-sm text-gray-600">
        Already have an account? <a href="/login" class="text-gray-900 font-medium hover:underline">Login here</a>
      </p>
    </div>
  </main>
</div>

{% block extra_scripts %}
<script>
  // Redirect if already logged in
  if (isTokenValid()) {
    window.location.href = '/';
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorDiv = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');

    // Validate passwords match
    if (password !== confirmPassword) {
      errorText.textContent = 'Passwords do not match';
      errorDiv.classList.remove('hidden');
      return;
    }

    // Clear previous errors
    errorDiv.classList.add('hidden');
    submitBtn.disabled = true;

    try {
      const data = await apiPost('/auth/register', {
        username,
        email,
        password,
      });

      setToken(data.access_token, data.user_id, data.expires_in);
      window.location.href = '/';
    } catch (error) {
      try {
        const errorData = await error.json();
        if (errorData.detail) {
          errorText.textContent = errorData.detail;
        }
      } catch (e) {
        errorText.textContent = 'Registration failed. Please try again.';
      }
      errorDiv.classList.remove('hidden');
      submitBtn.disabled = false;
    }
  });
</script>
{% endblock %}
