<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meal Tracker{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-orange': '#FF7043',
                        heading: '#263238',
                        body: '#546E7A',
                        cream: '#FFFDF9',
                        'cream-alt': '#FAF3EB',
                        error: '#D64444',
                        success: '#2E7D32',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    boxShadow: {
                        card: '0 2px 8px rgba(0,0,0,0.08)',
                        hover: '0 4px 12px rgba(0,0,0,0.12)',
                        modal: '0 8px 24px rgba(0,0,0,0.15)',
                    },
                },
            },
        };
    </script>

    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body class="bg-cream font-sans">
    {% block content %}{% endblock %}

    <!-- Core JS files -->
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/apiClient.js"></script>
    <script src="/static/js/formatting.js"></script>
    <script src="/static/js/nutrition.js"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
