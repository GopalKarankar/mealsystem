services:
  # Frontend: React + Vite served via Express
  - type: web
    name: meal-system-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_BASE_URL
        value: https://meal-system-backend.onrender.com
        scope: build
      - key: VITE_GOOGLE_CLIENT_ID
        fromDatabase:
          name: meal_db
          property: VITE_GOOGLE_CLIENT_ID
        scope: build
      - key: NODE_ENV
        value: production
        scope: build

  # Backend: FastAPI with Gunicorn
  - type: web
    name: meal-system-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:8000
    envVars:
      # Database
      - key: MONGODB_URL
        fromDatabase:
          name: meal_db
          property: MONGODB_URL
      - key: MONGODB_DB_NAME
        value: meal_system

      # Security
      - key: SECRET_KEY
        fromDatabase:
          name: meal_db
          property: SECRET_KEY
      - key: DEBUG
        value: "False"

      # LLM API (Groq)
      - key: GROQ_API_KEY
        fromDatabase:
          name: meal_db
          property: GROQ_API_KEY

      # Speech-to-Text (NVIDIA Parakeet)
      - key: NVIDIA_API_KEY
        fromDatabase:
          name: meal_db
          property: NVIDIA_API_KEY
      - key: NVIDIA_ASR_FUNCTION_ID
        fromDatabase:
          name: meal_db
          property: NVIDIA_ASR_FUNCTION_ID
      - key: NVIDIA_API_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_ASR_GRPC_URI
        value: grpc.nvcf.nvidia.com:443
      - key: NVIDIA_ASR_LANGUAGE_CODE
        value: en-US

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        fromDatabase:
          name: meal_db
          property: GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
        fromDatabase:
          name: meal_db
          property: GOOGLE_CLIENT_SECRET

  # MongoDB (if using Render's databases)
  - type: mongodb
    name: meal_db
    version: "7"
    plan: free
    # Set the following environment variables after creation:
    # MONGODB_URL, SECRET_KEY, GROQ_API_KEY, NVIDIA_API_KEY,
    # NVIDIA_ASR_FUNCTION_ID, VITE_GOOGLE_CLIENT_ID,
    # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
