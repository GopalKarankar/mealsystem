services:
  # Django monolith: templates + API + static files
  - type: web
    name: meal-system
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn meal_system.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 120
    envVars:
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: meal_db
          property: DATABASE_URL

      # Security
      - key: SECRET_KEY
        fromDatabase:
          name: meal_db
          property: SECRET_KEY
      - key: DEBUG
        value: "False"

      # LLM API (Groq)
      - key: GROQ_API_KEY
        fromDatabase:
          name: meal_db
          property: GROQ_API_KEY
      - key: LLM_MODEL
        value: openai/gpt-oss-120b

      # Speech-to-Text (NVIDIA Parakeet)
      - key: NVIDIA_API_KEY
        fromDatabase:
          name: meal_db
          property: NVIDIA_API_KEY
      - key: NVIDIA_ASR_FUNCTION_ID
        fromDatabase:
          name: meal_db
          property: NVIDIA_ASR_FUNCTION_ID
      - key: NVIDIA_API_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_ASR_GRPC_URI
        value: grpc.nvcf.nvidia.com:443
      - key: NVIDIA_ASR_LANGUAGE_CODE
        value: en-US

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        fromDatabase:
          name: meal_db
          property: GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
        fromDatabase:
          name: meal_db
          property: GOOGLE_CLIENT_SECRET

  # PostgreSQL database
  - type: pserv
    name: meal_db
    ipAllowList: []  # Only allow internal access
    # Set the following environment variables in Render dashboard:
    # DATABASE_URL, SECRET_KEY, GROQ_API_KEY, NVIDIA_API_KEY,
    # NVIDIA_ASR_FUNCTION_ID, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
